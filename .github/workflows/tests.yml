name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The test suite is fully offline (fake Wikipedia, embedder and LLM),
      # so skip the heavy sentence-transformers/PyTorch install.
      - run: pip install --no-deps -e . && pip install requests numpy pytest matplotlib
      - run: pytest -q
